[project]
name = "primo-churn"
version = "0.1.0"
description = "Churn prediction and analysis for the Oberry café-chain, built on the PRIMO loyalty platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.3.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "supabase>=2.31.0",
    "xgboost>=3.3.0",
]
